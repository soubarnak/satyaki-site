# JavaQuest self-hosted Java runner: Piston behind an authenticated gateway.
# Deploy target: hetzner1 (/srv/javaquest-runner/compose.yml), podman only.
# Follows /media/Toto/Documents/bongbetic/bongbetic-infra/hetzner1.md:
# Caddy owns host ports 80/443; backends join the shared `edge` network
# and publish NO host ports (ticket #26).
#
# Public surface: none. The gateway has no Caddy block and no published
# port, so the public internet cannot call Java execution directly. The
# site app (also on `edge`) reaches the gateway over the internal
# server-network address:
#   RUNNER_URL=http://javaquest-runner-gateway:80
# Every request must still carry header
#   X-Runner-Key: <RUNNER_KEY>
# Piston is never published directly.
#
# Key placement (never committed, never baked into an image):
#   - Runner side: /srv/javaquest-runner/.env holds RUNNER_KEY (mode 600).
#   - Site side: the site app server env holds the same value as
#     RUNNER_KEY plus RUNNER_URL above (lib/server/env.ts, ADR-0002).
# Rotation is an env-only operation: generate a new value, write it to
# both places, recreate both services. See README.md.
services:
  piston:
    image: ghcr.io/engineer-man/piston:latest
    container_name: javaquest-runner-piston
    privileged: true # required: Piston creates namespaces/cgroups per job (host must be cgroup v2)
    restart: unless-stopped
    volumes:
      - piston_data:/piston
    environment:
      # Hard caps from SRS NFR-004 / NFR-002 (CR-004: run route aborts by 10 s)
      PISTON_COMPILE_TIMEOUT: "5000"
      PISTON_COMPILE_CPU_TIME: "5000"
      PISTON_RUN_TIMEOUT: "5000" # ADR-0003/NFR-004: must admit the run route's 5000 ms budget (#25)
      PISTON_RUN_CPU_TIME: "3000"
      PISTON_RUN_MEMORY_LIMIT: "268435456" # 256 MB
      PISTON_COMPILE_MEMORY_LIMIT: "536870912" # 512 MB (javac)
      PISTON_DISABLE_NETWORKING: "true" # learner programs get no network
      PISTON_OUTPUT_MAX_SIZE: "10240"
      PISTON_MAX_CONCURRENT_JOBS: "4"
    expose:
      - "2000"
    networks:
      - edge

  gateway:
    image: docker.io/library/caddy:2-alpine
    container_name: javaquest-runner-gateway
    restart: unless-stopped
    depends_on:
      - piston
    environment:
      # Read from /srv/javaquest-runner/.env on the server (mode 600).
      # Must not contain whitespace: it is interpolated into a Caddyfile
      # header matcher line at startup. Generate with
      # `openssl rand -base64 48`.
      RUNNER_KEY: ${RUNNER_KEY}
    command:
      - sh
      - -c
      - |
        printf ':80 {\n @ok header X-Runner-Key %s\n handle @ok {\n  reverse_proxy piston:2000\n }\n handle {\n  respond "forbidden" 403\n }\n}\n' "$$RUNNER_KEY" > /etc/caddy/Caddyfile
        exec caddy run --config /etc/caddy/Caddyfile
    expose:
      - "80"
    networks:
      - edge

volumes:
  piston_data:

networks:
  edge:
    external: true
